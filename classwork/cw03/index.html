<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papago Buttes Trail Report</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main class="card">
        <h1>Papago Buttes Circuit</h1>
        <p id="total"></p>

        <h2>Station Report</h2>
        <p><label for="site">Site name</label><input type="text" id="site" value="Ranger Station"></p>
        <p><label for="hours">Hours open</label><input type="number" id="hours" value="3"></p>
        <p><label for="temp">Temperature &deg;F</label><input type="number" id="temp" value="108"></p>
        <button id="go">Build the report</button>
        <p id="report"></p>
    </main>
</body>
</html>
